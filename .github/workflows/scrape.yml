name: Scrape content

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'jikan (anime catalogue) | anime (real episodes, needs YOUTUBE_API_KEY) | anime-pd | tmdb | test-videos -- or any module in scripts/sources'
        type: string
        default: test-videos
      channels:
        description: "source='anime': YouTube handles to walk, comma-separated. Blank = the built-in licensor list"
        type: string
        default: ''
      limit:
        description: Most titles to import
        type: string
        default: '40'
      options:
        description: 'Extra flags for the source, e.g. --quality=1080 (overrides the inputs above)'
        type: string
        default: ''
      probe:
        description: Check every stream actually plays before importing it
        type: boolean
        default: true
      migrate:
        description: Apply any pending supabase/migrations first (leave on -- the SQL below can need a schema this database has not got yet)
        type: boolean
        default: true
      dry_run:
        description: Generate the SQL and upload it, but do not touch the database
        type: boolean
        default: false

concurrency:
  group: scrape-content
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.migrate }}
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  scrape:
    needs: migrate
    if: ${{ always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: database
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scrape
        env:
          SOURCE: ${{ inputs.source }}
          LIMIT: ${{ inputs.limit }}
          SCRAPE_OPTIONS: ${{ inputs.options }}
          PROBE: ${{ inputs.probe }}
          CHANNELS: ${{ inputs.channels }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Only source='anime' reads this. Absent is a normal state for a fork
          # that has not set the secret, and the branch below says so rather
          # than letting the importer's own error be the first clue.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p scrape-out

          # Checked here as well as in scrape.mjs because the value is also a
          # path fragment below, and this fails with a readable message.
          if ! printf '%s' "$SOURCE" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::source must be lowercase letters, digits and dashes, got '$SOURCE'"
            exit 1
          fi

          case "$LIMIT" in
            ''|*[!0-9]*) echo "::error::limit must be a whole number, got '$LIMIT'"; exit 1 ;;
          esac

          # Written as if/then, not `[ cond ] && var=x`: under `set -e` that
          # one-liner exits the job whenever the condition is false, because the
          # failed test becomes the statement's exit status.
          probe_flag=""
          if [ "$PROBE" != "true" ]; then probe_flag="--no-probe"; fi

          if [ "$SOURCE" = "tmdb" ] && [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::source='tmdb' needs a TMDB_API_KEY secret. Create a free key at https://www.themoviedb.org/settings/api and add it under Settings -> Secrets and variables -> Actions (repository level, or the 'database' environment)."
            exit 1
          fi

          # Two of the anime sources are NOT modules in scripts/sources, and
          # cannot be: scrape.mjs emits `public.movies` rows, one stream per
          # title, and a series is not that shape. Real anime episodes belong
          # in the series/episodes tables migration 0005 added, so they are
          # generated by their own importer and dispatched here. Everything
          # else goes through the generic runner.
          #
          #   anime     full episodes from official licensor channels on
          #             YouTube -> public.series + public.episodes.
          #             Needs YOUTUBE_API_KEY. This is the watchable one.
          #   anime-pd  the handful of public-domain anime FILMS on
          #             archive.org -> public.movies. Usually a short list.
          #   jikan     the MyAnimeList catalogue, streaming each title's
          #             trailer -> public.movies. Keyless, and the one that
          #             makes the Anime tab look like a library. An ordinary
          #             source module, so it needs no branch of its own.
          #
          # Applying any of them needs the migrations already on the database:
          # 0002 for the 'anime' category kind, and for `anime` also 0004 (the
          # 'youtube' protocol) and 0005. The migrate job above has done that
          # unless `migrate` was turned off.
          case "$SOURCE" in
            anime)
              if [ -z "${YOUTUBE_API_KEY:-}" ]; then
                echo "::error::source='anime' needs a YOUTUBE_API_KEY secret. Create a free YouTube Data API v3 key (see the header of scripts/import-anime.mjs) and add it under Settings -> Secrets and variables -> Actions. For an anime catalogue with no key at all, use source='jikan'; for public-domain films, source='anime-pd'."
                exit 1
              fi

              channels_flag=""
              if [ -n "$CHANNELS" ]; then channels_flag="--channels=$CHANNELS"; fi

              echo "::group::import-anime (official YouTube channels)"
              # No probe flag: this importer does not guess at liveness, it
              # asks the API for each video's privacyStatus and region
              # restrictions, which is strictly better information.
              node scripts/import-anime.mjs \
                --limit="$LIMIT" \
                $channels_flag \
                --out="scrape-out/anime.sql"
              echo "::endgroup::"
              ;;

            anime-pd)
              echo "::group::import-archive --kind=anime (public domain films)"
              node scripts/import-archive.mjs \
                --kind=anime \
                --limit="$LIMIT" \
                $probe_flag \
                --out="scrape-out/anime-pd.sql"
              echo "::endgroup::"
              ;;

            *)
              echo "::group::scrape --source=$SOURCE"
              node scripts/scrape.mjs \
                --source="$SOURCE" \
                --limit="$LIMIT" \
                $probe_flag \
                --out="scrape-out/${SOURCE}.sql"
              echo "::endgroup::"
              ;;
          esac

      - name: Upload generated SQL
        if: always() && hashFiles('scrape-out/*.sql') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scrape-sql-${{ github.run_id }}
          path: scrape-out/*.sql
          retention-days: 30

      - name: Apply to the database
        if: ${{ !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::secret SEED_DATABASE_URL is not set -- see the comment at the top of this workflow"
            exit 1
          fi

          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

          # ON_ERROR_STOP makes psql exit non-zero on the first failed
          # statement. Without it psql reports success after skipping every
          # statement in a broken file, and the job goes green having imported
          # nothing. The generated file is one transaction, so a file that fails
          # partway leaves no rows behind.
          for file in scrape-out/*.sql; do
            echo "::group::psql -f $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
            echo "::endgroup::"
          done

      - name: Summarise
        if: always()
        env:
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE: ${{ inputs.source }}
          SCRAPE_OPTIONS: ${{ inputs.options }}
        run: |
          set -euo pipefail
          {
            echo "## Scrape content"
            echo
            echo "Source: \`$SOURCE\`"
            if [ -n "$SCRAPE_OPTIONS" ]; then echo "Options: \`$SCRAPE_OPTIONS\`"; fi
            echo

            if [ -d scrape-out ] && [ -n "$(ls -A scrape-out 2>/dev/null)" ]; then
              echo "### Generated"
              echo
              echo "| File | Rows |"
              echo "|---|---|"
              for file in scrape-out/*.sql; do
                # Count the content tuples per table. Each row is preceded by a
                # provenance comment and followed by indented continuation
                # lines, so only the tuple itself starts with exactly two
                # spaces and a bracket.
                #
                # Counted per table rather than in one total because the anime
                # importer writes public.series AND public.episodes, and "14"
                # is a useless answer when the interesting number is "14
                # series, 312 episodes". public.categories is excluded: its
                # rows have the same shape, and reporting a file as 22 when it
                # imported 17 titles and 5 shelves is just wrong.
                rows=$(awk '
                  /^insert into public\./ {
                    match($0, /public\.[a-z_]+/)
                    table = substr($0, RSTART + 7, RLENGTH - 7)
                    target = 1
                    next
                  }
                  target && /^values/  { target = 0; counting = 1; next }
                  /^on conflict/       { counting = 0 }
                  counting && /^  \(./ { n[table]++ }
                  END {
                    split("channels movies series episodes", order, " ")
                    out = ""
                    for (i = 1; i <= 4; i++) {
                      t = order[i]
                      if (n[t]) out = out (out ? ", " : "") n[t] " " t
                    }
                    print out ? out : "0"
                  }
                ' "$file")
                echo "| \`$(basename "$file")\` | $rows |"
              done
              echo
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "> Dry run -- the database was not touched. The SQL is attached as an artifact."
            elif [ -n "${DATABASE_URL:-}" ]; then
              echo "### Now in the database"
              echo
              echo "| Category | Active titles |"
              echo "|---|---|"
              # This step runs with `if: always()`, so it must not fail the job
              # when it is reporting on an apply that already failed.
              psql "$DATABASE_URL" -At -F ' | ' -c "
                select c.slug, count(*)
                  from public.movies m
                  join public.categories c on c.id = m.category_id
                  where m.is_active
                  group by c.slug
                  order by c.slug;
              " 2>/dev/null | sed 's/^/| /; s/$/ |/' || echo "| _could not query the database_ | |"

              # Series are a SEPARATE psql call, not another union arm above,
              # because public.series only exists once migration 0005 has been
              # applied. A query naming a missing table fails when it is
              # parsed, so folding this into the query above would take the
              # movie counts down with it on any database that has not got
              # there yet -- and `to_regclass` guards do not help, both arms
              # are parsed either way.
              series=$(psql "$DATABASE_URL" -At -F ' | ' -c "
                select s.title, s.episode_count
                  from public.series s
                  where s.is_active and s.episode_count > 0
                  order by s.episode_count desc, s.title
                  limit 25;
              " 2>/dev/null || true)

              if [ -n "$series" ]; then
                echo
                echo "### Series with episodes"
                echo
                echo "| Series | Episodes |"
                echo "|---|---|"
                printf '%s\n' "$series" | sed 's/^/| /; s/$/ |/'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
